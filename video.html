<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MM Real Earn - Video Reward</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:#070b16;
    color:#fff;
}

body{
    overflow-x:hidden;
}

#feed{
    width:100%;
    min-height:100vh;
}

.video-page{
    width:100%;
    min-height:100vh;
    background:#070b16;
    position:relative;
    padding-bottom:25px;
}

/* YOUTUBE 16:9 PLAYER */

.player{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    position:relative;
}

.player iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:0;
}

/* TOP BAR */

.top{
    height:65px;
    padding:10px 15px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#0c1223;

    border-bottom:1px solid
    rgba(255,255,255,.07);
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:40px;
    height:40px;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #00e5ff,
        #6658e8
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:19px;

    box-shadow:
    0 0 18px
    rgba(0,229,255,.3);
}

.brand-name{
    font-size:16px;
    font-weight:800;
}

.brand-name span{
    color:#00e5ff;
}

.back{
    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:#18233c;

    color:#fff;
    font-size:24px;
}

/* VIDEO INFO */

.info{
    padding:17px;
    background:#0c1223;
}

.channel{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:13px;
}

.channel-dot{
    width:35px;
    height:35px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #ff0033,
        #ff6a00
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
}

.channel-name{
    font-size:14px;
    font-weight:800;
    flex:1;
}

.follow{
    border:1px solid
    rgba(255,255,255,.3);

    background:#18233c;

    color:#fff;

    padding:7px 11px;

    border-radius:9px;

    font-size:10px;
    font-weight:bold;
}

.video-title{
    font-size:16px;
    line-height:1.45;
    font-weight:600;
    margin-bottom:10px;
}

.reward-text{
    display:inline-block;

    padding:8px 11px;

    border-radius:10px;

    background:#111d34;

    color:#00e5ff;

    font-size:11px;
    font-weight:bold;
}

/* ACTIONS */

.actions{
    display:flex;
    gap:10px;

    padding:12px 17px;

    background:#0c1223;

    border-top:1px solid
    rgba(255,255,255,.05);
}

.action{
    width:48px;
    height:42px;

    border:0;
    border-radius:12px;

    background:#17223a;

    color:#fff;

    font-size:19px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.reward{
    background:
    linear-gradient(
        135deg,
        #00bcd4,
        #6658e8
    );

    flex:1;

    font-size:13px;
    font-weight:bold;
}

/* PROGRESS */

.progress{
    width:100%;
    height:3px;

    background:#1a253c;
}

.progress-bar{
    width:0%;
    height:100%;

    background:#00e5ff;

    transition:.2s;
}

/* SECOND VIDEO GAP */

.video-page + .video-page{
    margin-top:18px;
}

/* DESKTOP */

@media(min-width:700px){

    body{
        background:#050811;
    }

    .video-page{
        max-width:700px;
        margin:auto;

        box-shadow:
        0 0 50px
        rgba(0,0,0,.45);
    }

}

</style>
</head>

<body>

<div id="feed">


<!-- VIDEO 1 -->

<section class="video-page">

    <div class="player">

        <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&playsinline=1"
        allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        fullscreen"
        allowfullscreen>
        </iframe>

    </div>


    <div class="top">

        <div class="brand">

            <div class="logo">
                M
            </div>

            <div class="brand-name">
                MM <span>REAL</span> EARN
            </div>

        </div>

        <button
        class="back"
        onclick="goHome()">

            ‹

        </button>

    </div>


    <div class="info">

        <div class="channel">

            <div class="channel-dot">
                ▶
            </div>

            <div class="channel-name">
                @mlbypassus
            </div>

            <button class="follow">
                FOLLOW
            </button>

        </div>


        <div class="video-title">
            Your YouTube video will appear here
        </div>


        <div class="reward-text">
            🪙 Watch to earn reward
        </div>

    </div>


    <div class="actions">

        <button
        class="action"
        onclick="likeVideo(this)">
            ❤️
        </button>


        <button
        class="action reward"
        onclick="claimReward(this)">

            🪙 Claim Reward

        </button>


        <button
        class="action"
        onclick="shareVideo()">

            ↗

        </button>

    </div>


    <div class="progress">

        <div class="progress-bar"></div>

    </div>

</section>


<!-- VIDEO 2 -->

<section class="video-page">

    <div class="player">

        <iframe
        src="https://www.youtube.com/embed/M7lc1UVf-VE?autoplay=0&playsinline=1"
        allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        fullscreen"
        allowfullscreen>
        </iframe>

    </div>


    <div class="top">

        <div class="brand">

            <div class="logo">
                M
            </div>

            <div class="brand-name">
                MM <span>REAL</span> EARN
            </div>

        </div>


        <button
        class="back"
        onclick="goHome()">

            ‹

        </button>

    </div>


    <div class="info">

        <div class="channel">

            <div class="channel-dot">
                ▶
            </div>

            <div class="channel-name">
                @mlbypassus
            </div>

            <button class="follow">
                FOLLOW
            </button>

        </div>


        <div class="video-title">
            Video Reward
        </div>


        <div class="reward-text">
            🪙 Watch to earn reward
        </div>

    </div>


    <div class="actions">

        <button
        class="action"
        onclick="likeVideo(this)">
            ❤️
        </button>


        <button
        class="action reward"
        onclick="claimReward(this)">

            🪙 Claim Reward

        </button>


        <button
        class="action"
        onclick="shareVideo()">

            ↗

        </button>

    </div>


    <div class="progress">

        <div class="progress-bar"></div>

    </div>

</section>


</div>


<script>

/* HOME */

function goHome(){

    window.location.href="main.html";

}


/* LIKE */

function likeVideo(button){

    if(button.innerText.trim()==="❤️"){

        button.innerText="💖";

    }else{

        button.innerText="❤️";

    }

}


/* REWARD */

function claimReward(button){

    button.innerText="✅ Reward Claimed";

    button.disabled=true;

    alert("Reward added!");

}


/* SHARE */

function shareVideo(){

    if(navigator.share){

        navigator.share({

            title:"MM Real Earn",

            text:"Watch this video on MM Real Earn"

        });

    }else{

        alert("Share link copied!");

    }

}


/* WATCH PROGRESS */

const pages =
document.querySelectorAll(".video-page");


const observer =
new IntersectionObserver(

    entries=>{

        entries.forEach(entry=>{

            if(entry.isIntersecting){

                const bar =
                entry.target.querySelector(
                    ".progress-bar"
                );

                let progress=0;


                clearInterval(
                    entry.target.watchTimer
                );


                entry.target.watchTimer =
                setInterval(()=>{

                    progress += 1;

                    bar.style.width =
                    progress+"%";


                    if(progress>=100){

                        clearInterval(
                            entry.target.watchTimer
                        );

                    }

                },1000);

            }

        });

    },

    {
        threshold:.6
    }

);


pages.forEach(page=>{

    observer.observe(page);

});

</script>

</body>
</html>
