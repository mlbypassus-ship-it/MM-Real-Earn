<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      text-align: center;
    }

    .avatar {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #aaa;
    }

    .card {
      margin-top: 25px;
      padding: 20px;
      background: #10243a;
      border-radius: 18px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #ef4444;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="avatar">👤</div>

    <h1>My Profile</h1>

    <p>MM-Real-Earn</p>

    <div class="card">
      Profile
    </div>

    <button onclick="history.back()">
      Back
    </button>

  </div>

</body>
</html>
